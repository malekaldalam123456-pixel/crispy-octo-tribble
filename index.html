form{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
form label{display:flex;flex-direction:column;gap:4px;font-size:.8rem;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.done{opacity:.55}.done b{text-decoration:line-through}
.tag{font-size:.75rem;padding:2px 9px;border-radius:99px;border:1px solid var(--line);display:inline-block}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin:10px 0}

table{width:100%;border-collapse:collapse;font-size:.9rem}
th,td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:start;white-space:nowrap}
h3{margin:.1rem 0 .7rem;font-size:1.05rem}
.banner{margin-top:14px;padding:12px 16px;border-radius:14px;border:1px solid var(--red);color:var(--red)}
#toast{position:fixed;bottom:18px;inset-inline:18px;max-width:380px;margin-inline:auto;padding:12px 16px;border-radius:14px;background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(12px);opacity:0;transform:translateY(8px);transition:.25s;pointer-events:none}
#toast.show{opacity:1;transform:none}
#toast.ok{border-color:var(--green)}#toast.err{border-color:var(--red)}

.badge.off{opacity:.35;filter:grayscale(1)}

.modal[hidden]{display:none}

.ctitle{color:var(--gold);font-size:.85rem;font-weight:600}
.sw{display:block;width:100%;height:46px;border-radius:12px;margin-bottom:10px}
.cos{display:flex;flex-direction:column;gap:4px}
body[data-amb=amb_aurora]{background:radial-gradient(60% 50% at 15% 0%,rgba(52,199,123,.22),transparent 70%),radial-gradient(50% 40% at 90% 10%,rgba(59,130,246,.2),transparent 70%),var(--bg)}

.focus{display:flex;flex-direction:column;gap:12px}

#fx .spark{width:7px;height:7px;border-radius:50%;top:42%;animation:burst 1.1s ease-out forwards}

body[data-amb=amb_ember]{background:radial-gradient(70% 55% at 50% 110%,rgba(249,115,22,.35),transparent 70%),var(--bg)}

</div>

function invariants(s) {
  const net = s.ledger.reduce((a, e) => a + e.amount, 0);
  const saved = s.goals.reduce((a, g) => a + g.saved, 0);
  const chain = s.ledger.every((e, i, a) => e.after === e.before + e.amount && e.before === (i + 1 < a.length ? a[i + 1].after : 0));
  const goals = s.goals.every(g => g.saved >= 0 && g.saved <= g.target);
  if (s.balance < 0 || s.savings < 0 || net !== s.balance || saved !== s.savings || !chain || !goals) throw new Error('invariant');
}

class AppErr extends Error {}
const fail = code => { throw new AppErr(code); };
const ISO = /^\d{4}-\d{2}-\d{2}$/;
function validDate(v) { if (!v) return true; if (!ISO.test(v)) return false; const d = new Date(v + 'T00:00:00'); return !Number.isNaN(d.getTime()) && ymd(d) === v; }
let note = '';

function toast(msg, kind = 'ok', action = null) {
  const el = $('#toast');
  el.replaceChildren(document.createTextNode(msg + note));
  note = '';
  if (action) {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'tbtn'; b.textContent = action.label;
    b.onclick = () => { const r = action.fn(); if (r) render(); el.className = ''; };
    el.append(' ', b);
  }
  el.style.pointerEvents = action ? 'auto' : 'none';
  el.className = 'show ' + kind;
  clearTimeout(toast.h);
  toast.h = setTimeout(() => { el.className = ''; }, action ? 6000 : 3200);
}
const ok = k => toast(T(k), 'ok');

function post(d, type, amount, desc, ref) {
  const before = d.balance, after = before + amount;
  if (after < 0) fail('insufficient');
  d.balance = after;
  d.ledger.unshift({ id:uid(), ts:Date.now(), type, amount, before, after, desc, ref });
}

function run(fn) {
  const draft = JSON.parse(JSON.stringify(S));
  note = '';
  try {
    const out = fn(draft) ?? {};
    const L0 = levelOf(S.xp), L1 = levelOf(draft.xp);
    const got = unlockAchievements(draft);
    invariants(draft);
    if (!persist(draft)) fail('storage');
    S = draft;
    note = (L1 > L0 ? ` · ${T('levelUp')} ${L1}` : '') + got.map(id => ` · 🏆 ${T('ach.' + id + '.n')}`).join('');
    return out;
  } catch (e) {
    if (!(e instanceof AppErr)) console.error(e);
    toast(T('err.' + (e instanceof AppErr ? e.message : 'invalid')), 'err');
    return null;
  }
}
const done = (fn, msg) => { const r = run(fn); if (r && msg) ok(msg); return r; };

// ---------- Tasks ----------
const isRec = t => ['daily','weekly','monthly'].includes(t.freq);
function parseTask(f) {
  const title = (f.title || '').trim(), reward = toP(f.reward);
  if (!title || title.length > 200 || reward === null || reward > 1000000 || !DIFF[f.difficulty]) fail('invalid');
  if (!validDate(f.due)) fail('invalid');
  const freq = ['none', 'daily', 'weekly', 'monthly'].includes(f.freq) ? f.freq : 'none';
  return { title, reward, difficulty: f.difficulty, freq, due: f.due || (freq === 'none' ? '' : today()) };
}
const addTask = f => done(d => { d.tasks.unshift({ id: uid(), ...parseTask(f), status: 'pending', completedAt: null, xp: 0, history: [] }); }, 'added');
const updateTask = (id, f) => done(d => {
  const t = d.tasks.find(x => x.id === id);
  if (!t) fail('notfound');
  if (t.status === 'completed') fail('completedLocked');
  Object.assign(t, parseTask(f));
}, 'savedOk');
function completeTask(id) {
  const r = run(d => {
    const t = d.tasks.find(x => x.id === id);
    if (!t) fail('notfound');
    const xp = XPD[t.difficulty];
    if (isRec(t)) {
      if (t.due > today()) fail('notDue');
      const h = { id: uid(), date: t.due, ts: Date.now(), reward: t.reward, xp, prevDue: t.due };
      if (t.history.some(x => x.date === h.date)) fail('already');
      const base = t.due < today() ? today() : t.due; t.due = t.freq === 'daily' ? addDays(base,1) : t.freq === 'weekly' ? addDays(base,7) : addMonths(base,1);
      t.history.unshift(h); d.xp += xp; d.lifetime += t.reward;
      if (t.reward > 0) post(d, 'task_reward', t.reward, t.title, t.id);
      return { hid: h.id };
    }
    if (t.status === 'completed') fail('already');
    t.status = 'completed'; t.completedAt = Date.now(); t.xp = xp;
    d.xp += xp; d.lifetime += t.reward;
    if (t.reward > 0) post(d, 'task_reward', t.reward, t.title, t.id);
    return {};
  });
  if (r) { celebrate(); toast(T('completedMsg'), 'ok', { label: T('undo'), fn: () => undoComplete(id, r.hid) }); }
  return r;
}
function undoComplete(id, hid) {
  const r = run(d => {
    const t = d.tasks.find(x => x.id === id);
    if (!t) fail('invalid');
    if (isRec(t)) {
      const h = t.history[0];
      if (!h || h.id !== hid) fail('invalid');
      if (h.reward > 0) post(d, 'reversal', -h.reward, t.title, t.id);
      d.xp -= h.xp; t.due = h.prevDue; t.history.shift();
      return;
    }
    if (t.status !== 'completed') fail('invalid');
    if (t.reward > 0) post(d, 'reversal', -t.reward, t.title, t.id);
    d.xp -= t.xp;
    t.status = 'pending'; t.completedAt = null; t.xp = 0;
  });
  if (r) ok('undone');
  return r;
}
const deleteTask = id => done(d => {
  const i = d.tasks.findIndex(x => x.id === id);

    p.status = 'redeemed'; p.redeemedAt = Date.now();

// ---------- Savings ----------
function addGoal(f) {
  return done(d => {
    const name = (f.name || '').trim(), target = toP(f.target);
    if (!name || name.length > 120 || !target || target > 10000000) fail('invalid');
    if (!validDate(f.date)) fail('invalid');
    d.goals.unshift({ id:uid(), name, target, saved:0, date:f.date || '', status:'active' });
  }, 'goalAdded');
}

function deposit(gid, amount, key) {
  const r = run(d => {
    if (d.used[key]) return { replayed:true };
    const g = d.goals.find(x => x.id === gid);
    if (!g) fail('notfound');
    if (g.status !== 'active') fail('notActive');
    if (!amount || amount <= 0) fail('invalid');
    if (amount > g.target - g.saved) fail('exceeds');
    post(d, 'savings_deposit', -amount, g.name, g.id);
    g.saved += amount; d.savings += amount; d.used[key] = g.id;
    if (g.saved === g.target) g.status = 'completed';
    return { completed: g.status === 'completed' };
  });
  if (r) ok(r.replayed ? 'dup' : r.completed ? 'goalDone' : 'depOk');
  return r;
}

function withdraw(gid, amount, key) {
  const r = run(d => {
    if (d.used[key]) return { replayed:true };
    const g = d.goals.find(x => x.id === gid);
    if (!g) fail('notfound');
    if (!amount || amount <= 0) fail('invalid');
    if (amount > g.saved || amount > d.savings) fail('savedLow');
    post(d, 'savings_withdrawal', amount, g.name, g.id);
    g.saved -= amount; d.savings -= amount; d.used[key] = g.id;
    if (g.status === 'completed') g.status = 'active';
  });
  if (r) ok(r.replayed ? 'dup' : 'wdOk');
  return r;
}

function buyCosmetic(id, key) {
  const r = run(d => {
    if (d.used[key]) return { replayed: true };
    const it = cosById(id);
    if (!it) fail('notfound');
    if (d.cos.owned.includes(id)) fail('alreadyOwned');
    if (!reqMet(it, d)) fail('locked');
    post(d, 'shop_purchase', -it.price, T('cos.' + id), id);
    d.spending += it.price; d.cos.owned.push(id); d.used[key] = id;

}

function weekChart() {
  const base = new Date(); base.setHours(0, 0, 0, 0);
  const days = [...Array(7)].map((_, i) => { const d = new Date(base); d.setDate(base.getDate() - 6 + i); return d; });
  const vals = days.map(d => {
    const a = d.getTime(), b = new Date(d).setDate(d.getDate() + 1);
    return S.ledger.filter(e => (e.type === 'task_reward' || e.type === 'reversal') && e.ts >= a && e.ts < b).reduce((sum, e) => sum + e.amount, 0);
  });
  const max = Math.max(1, ...vals), W = 420, H = 150, bw = 36, gap = (W - 7 * bw) / 7, wd = new Intl.DateTimeFormat(loc(), { weekday: 'short' });
  const bars = vals.map((v, i) => {
    const h = Math.round(v / max * (H - 36)), x = gap / 2 + i * (bw + gap);
    return `<rect x="${x}" y="${H - 22 - h}" width="${bw}" height="${h}" rx="7" fill="url(#eg)"><title>${fmt(v)}</title></rect>
      <text x="${x + bw / 2}" y="${H - 6}" text-anchor="middle" font-size="11" fill="currentColor" opacity=".7">${wd.format(days[i])}</text>`;
  }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${T('weekly')}" style="color:var(--muted)">

}

const AVATARS = ['🧑‍🚀','🦊','🐼','🐯','🐸','🐙','🦉','🐉','🤖','🧙'];
const METRICS = ['tasks','focus','habits'];
const metricValue = (d, metric) => metric === 'tasks' ? doneCount(d) : metric === 'focus' ? d.focus.reduce((n,x)=>n+(x.min||0),0) : d.habits.reduce((n,h)=>n+(h.logs||[]).length,0);
function challengeWindow(period){const d=new Date();d.setHours(0,0,0,0);if(period==='daily')return {start:d.getTime(),key:'daily:'+ymd(d)};if(period==='monthly'){d.setDate(1);return {start:d.getTime(),key:'monthly:'+ymd(d).slice(0,7)};}d.setDate(d.getDate()-((d.getDay()+6)%7));return {start:d.getTime(),key:'weekly:'+ymd(d)};}
function challengeProgress(d,c){const w=challengeWindow(c.period||'weekly');if(c.metric==='tasks')return d.tasks.reduce((n,t)=>n+(t.status==='completed'&&t.completedAt>=w.start?1:0)+(t.history||[]).filter(h=>(h.ts||new Date(h.date+'T12:00:00').getTime())>=w.start).length,0);if(c.metric==='focus')return d.focus.filter(x=>x.ts>=w.start).reduce((n,x)=>n+(x.min||0),0);return d.habits.reduce((n,h)=>n+(h.logs||[]).filter(day=>new Date(day+'T12:00:00').getTime()>=w.start).length,0);}
function addHabit(f) { return done(d=>{ const name=(f.name||'').trim(); if(!name||name.length>80) fail('invalid'); d.habits.unshift({id:uid(),name,createdAt:Date.now(),logs:[]}); },'extra.habitAdded'); }
function toggleHabit(id) { return done(d=>{ const h=d.habits.find(x=>x.id===id); if(!h) fail('notfound'); h.logs??=[]; if(h.logs.includes(today())) fail('already'); h.logs.push(today()); d.xp+=5; }); }
function deleteHabit(id) { return done(d=>{const i=d.habits.findIndex(x=>x.id===id);if(i<0)fail('notfound');d.habits.splice(i,1);}); }
function addChallenge(f) { return done(d=>{ const name=(f.name||'').trim(),target=Math.floor(Number(f.target)),reward=toP(f.reward),metric=f.metric; if(!name||name.length>100||!Number.isInteger(target)||target<1||target>100000||reward===null||reward<1||reward>10000000||!METRICS.includes(metric)) fail('badTarget'); const period=['daily','weekly','monthly'].includes(f.period)?f.period:'weekly'; if(!validDate(f.dueDate))fail('badTarget'); d.challenges.unshift({id:uid(),name,target,reward,metric,period,dueDate:f.dueDate||'',baseline:metricValue(d,metric),createdAt:Date.now(),claimed:false}); },'extra.challengeAdded'); }
function claimChallenge(id) { return done(d=>{const c=d.challenges.find(x=>x.id===id);if(!c)fail('notfound');c.claimedPeriods??=[];const key=challengeWindow(c.period||'weekly').key;if(c.claimedPeriods.includes(key))fail('claimed');if(challengeProgress(d,c)<c.target)fail('badTarget');post(d,'challenge_reward',c.reward,c.name,c.id+':'+key);d.lifetime+=c.reward;c.claimedPeriods.push(key);c.claimed=true;},'extra.claimed'); }
function saveProfile(f) { return done(d=>{const name=(f.name||'').trim(),bio=(f.bio||'').trim(),avatar=f.avatar;if(!name||name.length>40||bio.length>180||!AVATARS.includes(avatar))fail('invalid');d.profile={...d.profile,name,bio,avatar,photo:f.photoData||d.profile.photo||'',frame:['rare','epic','legendary'].includes(f.frame)?f.frame:'rare'};},'extra.profileSaved'); }
function addFriend(f) { return done(d=>{const name=(f.name||'').trim();if(!name||name.length>40)fail('invalid');if(d.friends.some(x=>x.name.toLowerCase()===name.toLowerCase()))fail('invalid');d.friends.push({id:uid(),name,addedAt:Date.now()});},'extra.friendAdded'); }
function removeFriend(id) { return done(d=>{d.friends=d.friends.filter(x=>x.id!==id);}); }
function createAuction(f) { return done(d=>{const name=(f.name||'').trim(),price=toP(f.price);if(!name||name.length>100||price===null||price<1||!validDate(f.date)||!f.date||f.date<today())fail('invalid');d.auctions.unshift({id:uid(),name,price,date:f.date,createdAt:Date.now(),status:'open'});},'extra.auctionAdded'); }
function deleteAuction(id) { return done(d=>{d.auctions=d.auctions.filter(x=>x.id!==id);}); }

function localAssistantReply(q) { const s=stats(),text=q.toLowerCase(); if(/رصيد|فلوس|محفظ|balance|money/.test(text)) return `${T('balance')}: ${fmt(S.balance)}. ${T('saved')}: ${fmt(S.savings)}. ${T('lifetime')}: ${fmt(S.lifetime)}.`; if(/مهمة|مهام|task/.test(text)) return `${T('done')}: ${s.done} · ${T('pending')}: ${s.pending} · ${T('overdue')}: ${s.overdue}. ${s.overdue?'ابدأ بمهمة متأخرة صغيرة لتستعيد الزخم.':'اختار مهمة واحدة مهمة وابدأ بها الآن.'}`; if(/تركيز|focus|وقت/.test(text)) {const mins=S.focus.reduce((a,x)=>a+x.min,0);return `${T('focusHours')}: ${(mins/60).toFixed(1)}. جرّب جلسة تركيز 25 دقيقة مع إبعاد المشتتات.`;} if(/عادة|hab/.test(text)) return `عندك ${S.habits.length} عادة. ابدأ بعادة واحدة صغيرة وثبّت وقتها يومياً.`; if(/تحد|challenge/.test(text)) return `عندك ${S.challenges.length} تحديات. راجع التقدم، واستلم مكافأة أي تحدٍ وصلت لهدفه.`; return `اقتراحي: اختار مهمة واحدة مدتها أقل من 30 دقيقة، نفذها، وبعدها خذ استراحة قصيرة. تقدم صغير كل يوم أفضل من خطة ضخمة لا تبدأ.`; }

function challengesView() { const rows=S.challenges.map(c=>{const n=challengeProgress(S,c),pct=Math.min(100,Math.round(n/c.target*100)),key=challengeWindow(c.period||'weekly').key,claimed=(c.claimedPeriods||[]).includes(key);return `<section class="card"><div class="row"><b>${esc(c.name)}</b><span class="tag">${fmt(c.reward)}</span></div><div class="muted">${c.period==='daily'?'يومي':c.period==='monthly'?'شهري':'أسبوعي'} · ${T('extra.'+c.metric+'Metric')} · ${n}/${c.target}</div><div class="bar"><i style="width:${pct}%"></i></div>${claimed?`<span class="tag pos">✓ ${T('extra.claimed')}</span>`:`<button class="primary" data-act="challenge-claim" data-id="${c.id}" ${n>=c.target?'':'disabled'}>${T('extra.claim')}</button>`}${c.dueDate?`<p class="muted">آخر موعد: ${esc(c.dueDate)}</p>`:''}</section>`}).join('');return `<section class="card"><h3>${T('extra.challenges')}</h3><form data-form="challenge"><label style="flex:1 1 180px">${T('extra.challengeName')}<input name="name" maxlength="100" required></label><label>${T('extra.metric')}<select name="metric"><option value="tasks">${T('extra.tasksMetric')}</option><option value="focus">${T('extra.focusMetric')}</option><option value="habits">${T('extra.habitsMetric')}</option></select></label><label>${T('extra.target')}<input name="target" type="number" min="1" max="100000" required></label><label>${T('extra.prize')}<input name="reward" inputmode="decimal" required></label><label>الفترة<select name="period"><option value="daily">يومي</option><option value="weekly" selected>أسبوعي</option><option value="monthly">شهري</option></select></label><label>آخر موعد<input name="dueDate" type="date"></label><button class="primary">${T('add')}</button></form></section>${rows||`<section class="card muted">${T('extra.noChallenges')}</section>`}`; }
function dateShift(iso,n){const d=new Date(iso+'T12:00:00');d.setDate(d.getDate()+n);return ymd(d)}
function monthShift(iso,n){const d=new Date(iso+'T12:00:00');d.setDate(1);d.setMonth(d.getMonth()+n);return ymd(d)}
function weekStart(iso){const d=new Date(iso+'T12:00:00');d.setDate(d.getDate()-((d.getDay()+6)%7));return ymd(d)}
function calendarEvents(){const a=S.tasks.filter(t=>t.due).map(t=>({date:t.due,title:t.title,icon:t.status==='completed'?'✅':'📌',kind:'task'}));S.tasks.forEach(t=>(t.history||[]).forEach(h=>a.push({date:h.date,title:t.title,icon:'✅',kind:'completed'})));S.tasks.filter(t=>t.status==='completed'&&t.completedAt).forEach(t=>a.push({date:ymd(new Date(t.completedAt)),title:t.title,icon:'✅',kind:'completed'}));S.goals.filter(g=>g.date).forEach(g=>a.push({date:g.date,title:g.name,icon:'🎯',kind:'goal'}));S.challenges.filter(c=>c.dueDate).forEach(c=>a.push({date:c.dueDate,title:c.name,icon:'🏆',kind:'challenge'}));S.habits.forEach(h=>a.push({date:today(),title:h.name,icon:'🔁',kind:'habit'}));return a;}
function calendarView(){const anchor=ui.calDate||today(),events=calendarEvents(),d=new Date(anchor+'T12:00:00');let title='',body='';const dayNames=ui.lang==='ar'?['الإثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت','الأحد']:['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];

else{const first=new Date(d.getFullYear(),d.getMonth(),1,12),offset=(first.getDay()+6)%7,start=new Date(first);start.setDate(first.getDate()-offset);const days=Array.from({length:42},(_,i)=>{const x=new Date(start);x.setDate(start.getDate()+i);return ymd(x)});title=new Intl.DateTimeFormat(loc(),{month:'long',year:'numeric'}).format(d);body=`<div class="cal-grid">${dayNames.map(n=>`<div class="muted" style="text-align:center;font-size:.75rem">${n}</div>`).join('')}${days.map(date=>`<div class="cal-cell ${date===today()?'today':''} ${date.slice(0,7)!==anchor.slice(0,7)?'out':''}"><b>${Number(date.slice(8))}</b>${listFor(date)}</div>`).join('')}</div>`;}
return `<section class="card"><h3>🗓️ التقويم</h3><div class="cal-toolbar"><button data-act="cal-prev">‹</button><button data-act="cal-today">اليوم</button><button data-act="cal-next">›</button><span class="spacer"></span><b>${esc(title)}</b></div><div class="actions" style="margin:12px 0"><button data-act="cal-mode" data-mode="day" class="${ui.calMode==='day'?'primary':''}">يومي</button><button data-act="cal-mode" data-mode="week" class="${ui.calMode==='week'?'primary':''}">أسبوعي</button><button data-act="cal-mode" data-mode="month" class="${ui.calMode==='month'?'primary':''}">شهري</button></div>${body}</section>`;}

function analyticsView(){const from=rangeStart(ui.analyticsRange),ledger=S.ledger.filter(e=>e.ts>=from),earned=ledger.filter(e=>e.amount>0).reduce((a,e)=>a+e.amount,0),spent=-ledger.filter(e=>e.amount<0).reduce((a,e)=>a+e.amount,0),focus=S.focus.filter(x=>x.ts>=from),mins=focus.reduce((a,x)=>a+x.min,0),habits=S.habits.reduce((a,h)=>a+(h.logs||[]).filter(day=>new Date(day+'T12:00:00').getTime()>=from).length,0),tasks=S.tasks.reduce((a,t)=>a+(t.history||[]).filter(h=>new Date(h.date+'T12:00:00').getTime()>=from).length+(t.status==='completed'&&t.completedAt>=from?1:0),0);
const groups={};ledger.forEach(e=>{let k='أخرى';if(['task_reward','reversal'].includes(e.type)){const task=S.tasks.find(t=>t.id===e.ref);k=task?('المهام · '+T(task.difficulty)):'المهام';}else if(e.type==='shop_purchase'){k=e.category&&STR.ar.cats[e.category]?STR.ar.cats[e.category]:'المتجر';}else if(['savings_deposit','savings_withdrawal'].includes(e.type))k='الادخار';else if(e.type==='challenge_reward')k='التحديات';groups[k]=(groups[k]||0)+Math.abs(e.amount)});const max=Math.max(1,...Object.values(groups));const chart=Object.entries(groups).map(([k,v])=>`<div class="chart-col"><div class="chart-bar" style="height:${Math.max(4,Math.round(v/max*130))}px" title="${fmt(v)}"></div><small>${esc(k)}</small><small>${fmt(v)}</small></div>`).join('')||'<p class="muted">لا توجد معاملات في الفترة المحددة.</p>';
return `<section class="card"><h3>📊 تحليلات الأداء</h3><div class="filter-toolbar"><label>الفترة<select id="analyticsRange"><option value="7" ${ui.analyticsRange==='7'?'selected':''}>آخر 7 أيام</option><option value="30" ${ui.analyticsRange==='30'?'selected':''}>آخر 30 يومًا</option><option value="90" ${ui.analyticsRange==='90'?'selected':''}>آخر 90 يومًا</option><option value="365" ${ui.analyticsRange==='365'?'selected':''}>آخر سنة</option><option value="all" ${ui.analyticsRange==='all'?'selected':''}>كل الوقت</option></select></label></div><div class="grid">${stat('المهام المنجزة',tasks)}${stat('ساعات التركيز',(mins/60).toFixed(1))}${stat('إنجازات العادات',habits)}${stat('صافي العملة',fmt(earned-spent))}</div><h3 style="margin-top:18px">حركة العملة حسب الفئة</h3><div class="chart-bars">${chart}</div><div class="grid" style="margin-top:14px">${stat('إجمالي الإضافات',fmt(earned),'pos')}${stat('إجمالي الخصومات',fmt(spent),'neg')}${stat('المدخرات الحالية',fmt(S.savings))}${stat('الرصيد الحالي',fmt(S.balance))}</div><p class="muted">البيانات محلية وتخص الملف الشخصي على هذا الجهاز.</p></section>`;}
function reportSummary(days){const from=Date.now()-days*86400000,tx=S.ledger.filter(e=>e.ts>=from),earned=tx.filter(e=>e.amount>0).reduce((a,e)=>a+e.amount,0),spent=-tx.filter(e=>e.amount<0).reduce((a,e)=>a+e.amount,0),focus=S.focus.filter(x=>x.ts>=from).reduce((a,x)=>a+x.min,0),tasks=S.tasks.reduce((a,t)=>a+(t.history||[]).filter(h=>h.ts>=from).length+(t.status==='completed'&&t.completedAt>=from?1:0),0),habits=S.habits.reduce((a,h)=>a+(h.logs||[]).filter(day=>new Date(day+'T12:00:00').getTime()>=from).length,0);return {earned,spent,focus,tasks,habits};}
function profileView(){const p=S.profile,rw=reportSummary(7),rm=reportSummary(30),pic=p.photo?`<img src="${p.photo}" alt="صورة الحساب">`:`<span class="avatar-emoji">${esc(p.avatar)}</span>`,frame=['epic','legendary'].includes(p.frame)?p.frame:'rare';return `<section class="card"><div class="profile-head"><div class="avatar-wrap frame-${frame}">${pic}</div><div><h2 style="margin:0">${esc(p.name||'EARN IT Player')}</h2><p class="muted">${esc(p.bio||'رحلتك تبدأ بإنجاز صغير كل يوم.')}</p><span class="tag">المستوى ${levelOf(S.xp)} · ${S.xp} XP</span></div></div></section><section class="card"><h3>تعديل الملف الشخصي</h3><form data-form="profile"><label>الصورة الشخصية<input name="photo" type="file" accept="image/*"></label><label>الأفاتار<select name="avatar">${AVATARS.map(a=>`<option ${a===p.avatar?'selected':''}>${a}</option>`).join('')}</select></label><label style="flex:1 1 180px">اسم العرض<input name="name" maxlength="40" required value="${esc(p.name)}"></label><label style="flex:1 1 100%">نبذة قصيرة<input name="bio" maxlength="180" value="${esc(p.bio)}"></label><label>الإطار المتحرك<select name="frame"><option value="rare" ${frame==='rare'?'selected':''}>أزرق متحرك</option><option value="epic" ${frame==='epic'?'selected':''}>بنفسجي متحرك</option><option value="legendary" ${frame==='legendary'?'selected':''}>ذهبي أسطوري</option></select></label><button class="primary">حفظ الملف الشخصي</button></form><p class="muted">الصورة تُضغط قبل الحفظ لتقليل مساحة التخزين.</p></section><section class="card"><h3>📅 تقاريري الأسبوعية والشهرية</h3><div class="report-card"><b>تقرير آخر 7 أيام</b><div class="grid">${stat('المهام',rw.tasks)}${stat('التركيز',rw.focus+' دقيقة')}${stat('العادات',rw.habits)}${stat('صافي الأرباح',fmt(rw.earned-rw.spent))}</div></div><div class="report-card"><b>تقرير آخر 30 يومًا</b><div class="grid">${stat('المهام',rm.tasks)}${stat('التركيز',rm.focus+' دقيقة')}${stat('العادات',rm.habits)}${stat('صافي الأرباح',fmt(rm.earned-rm.spent))}</div></div><div class="actions"><button data-act="profile-report">تصدير التقرير JSON</button><button data-act="install-pwa" id="installPwaBtn">تثبيت التطبيق</button></div></section><section class="card"><h3>${T('extra.notifications')}</h3><p class="muted">${T('extra.notifyHint')}</p><button class="primary" data-act="notifications">${T('extra.enableNotifications')}</button></section>`;}

// ---------- Rendering & events ----------
function render() {
  if(!ui.calDate) ui.calDate=today();
  if(S?.profile?.name){hideAuth();}else{showAuth();}
  updateUserMini();
  const root = document.documentElement;
  root.lang = ui.lang; root.dir = ui.lang === 'ar' ? 'rtl' : 'ltr'; root.dataset.theme = ui.theme;
  $('#tag').textContent = T('tagline');
  $('#langBtn').textContent = T('lang');
  $('#themeBtn').textContent = T(ui.theme === 'dark' ? 'toLight' : 'toDark');
  $('#nav').innerHTML = ['dashboard', 'tasks', 'habits', 'challenges', 'focus', 'calendar', 'shop', 'savings', 'wallet', 'analytics', 'auctions', 'social', 'assistant', 'profile'].map(t =>
    `<button type="button" data-act="tab" data-tab="${t}" ${ui.tab === t ? 'aria-current="page"' : ''}>${T('nav.' + t)}</button>`).join('');
  const banner = ui.banner ? `<div class="banner" role="alert">${T(ui.banner)}</div>` : '';
  ui.banner = '';
  applyCos();
  $('#app').innerHTML = banner + VIEWS[ui.tab]();
}

document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const { act, id } = el.dataset;
  let r = true;
  switch (act) {
    case 'tab': ui.tab = el.dataset.tab; break;
    case 'cal-mode': ui.calMode=el.dataset.mode; break;
    case 'cal-today': ui.calDate=today(); break;
    case 'cal-prev': ui.calDate=ui.calMode==='month'?monthShift(ui.calDate,-1):dateShift(ui.calDate,ui.calMode==='day'?-1:-7); break;
    case 'cal-next': ui.calDate=ui.calMode==='month'?monthShift(ui.calDate,1):dateShift(ui.calDate,ui.calMode==='day'?1:7); break;
    case 'logout': localStorage.removeItem('earnit.session'); showAuth(); r=false; break;
    case 'profile-report': exportProfileReport(); r=false; break;
    case 'install-pwa': if(window.deferredInstallPrompt){window.deferredInstallPrompt.prompt();window.deferredInstallPrompt.userChoice.finally(()=>{window.deferredInstallPrompt=null;});}else toast('لو التثبيت غير ظاهر، استخدم قائمة المتصفح ثم تثبيت التطبيق.'); r=false; break;
    case 'filter': ui.filter = el.dataset.f; break;
    case 'lang': ui.lang = ui.lang === 'ar' ? 'en' : 'ar'; savePrefs(); break;
    case 'theme': ui.theme = ui.theme === 'dark' ? 'light' : 'dark'; savePrefs(); break;
    case 'complete': r = completeTask(id); break;
    case 'deltask': r = (await confirmBox(T('deleteConfirm'))) ? deleteTask(id) : true; break;
    case 'edit': editTaskModal(id); r = false; break;
    case 'postpone': r = postponeTask(id); break;
    case 'dup': r = duplicateTask(id); break;
    case 'buy': r = (await confirmBox(T('confirmBuy'))) ? buy(id, uid()) : true; break;
    case 'redeem': r = redeem(id); break;
    case 'archreward': r = archiveReward(id); break;
    case 'cosbuy': r = (await confirmBox(T('confirmBuy'))) ? buyCosmetic(id, uid()) : true; break;
    case 'coseq': r = equipCos(id); break;
    case 'fstart': FOCUS.timer ? focusPause() : focusStart(); break;
    case 'freset': focusReset(); break;
    case 'dep': r = deposit(id, toP(el.closest('.goal').querySelector('input').value), uid()); break;
    case 'wd': r = withdraw(id, toP(el.closest('.goal').querySelector('input').value), uid()); break;
    case 'export': exportData(); break;
    case 'import': $('#importFile')?.click(); r=false; break;
    case 'csv': exportCsv(); break;
    case 'reset': r = await resetAll(); break;
    case 'habit-toggle': r = toggleHabit(id); break;
    case 'habit-delete': r = (await confirmBox(T('deleteConfirm'))) ? deleteHabit(id) : true; break;
    case 'challenge-claim': r = claimChallenge(id); break;
    case 'friend-delete': r = removeFriend(id); break;
    case 'auction-delete': r = deleteAuction(id); break;
    case 'notifications': if ('Notification' in window) { const p = await Notification.requestPermission(); S.notifications.permission=p; S.notifications.enabled=p==='granted'; persist(S); if(p==='granted'){ new Notification('EARN IT',{body:'تم تفعيل الإشعارات'}); toast(T('extra.notificationOn')); } else toast(T('extra.permissionDenied'),'err'); } else toast(T('extra.permissionDenied'),'err'); r=false; break;
    case 'modal-ok': closeModal(true); r = false; break;
    case 'modal-no': closeModal(false); r = false; break;
  }
  if (r) render();
});

document.addEventListener('submit', async e => {
  e.preventDefault();
  const f = Object.fromEntries(new FormData(e.target)), form = e.target.dataset.form;
  if(form==='profile'){const file=e.target.elements.photo?.files?.[0]; if(file){try{f.photoData=await compressProfileImage(file);}catch{toast('تعذر قراءة الصورة. جرّب صورة أخرى.','err');return;}} else f.photoData=S.profile.photo||''; if(saveProfile(f)){render();toast('تم تحديث ملفك الشخصي');} return;}
  if (form === 'edit') { if (updateTask(e.target.dataset.id, f)) { closeModal(true); render(); } return; }
  if (form === 'assistant') { const q=(f.q||'').trim(); if(!q){toast(T('extra.askFirst'),'err');return;} const log=$('#chatlog'); log.insertAdjacentHTML('beforeend',`<div class="row"><b>أنت:</b> ${esc(q)}</div><div class="row"><b>شهد:</b> ${esc(localAssistantReply(q))}</div>`); log.scrollTop=log.scrollHeight; e.target.reset(); return; }
  const action = { task: addTask, reward: addReward, goal: addGoal, habit:addHabit, challenge:addChallenge, friend:addFriend, auction:createAuction }[form];
  if (action && action(f)) render();
});

document.addEventListener('change', async e => {
  if (e.target.id === 'analyticsRange') { ui.analyticsRange=e.target.value; render(); }
  if (e.target.id === 'importFile' && e.target.files?.[0]) { await importDataFile(e.target.files[0]); e.target.value=''; return; }
  if (e.target.name === 'difficulty') e.target.form.elements.reward.value = mid(e.target.value);
  if (e.target.id === 'sort') { ui.sort = e.target.value; $('#tlist').innerHTML = taskList(); }
  if (e.target.id === 'flen') { FOCUS.len = Number(e.target.value); if (!FOCUS.timer) FOCUS.left = FOCUS.len * 60; saveFocusClock(); render(); }
  if (e.target.id === 'ftask') { FOCUS.tid = e.target.value; saveFocusClock(); }
});

document.addEventListener('input', e => {
  if (e.target.id === 'q') { ui.q = e.target.value; $('#tlist').innerHTML = taskList(); }
});

document.addEventListener('keydown', e => {
  const m = modalEl();
  if (!m.hidden) {
    if (e.key === 'Escape') closeModal(false);
    if (e.key === 'Tab') {
      const f = [...m.querySelectorAll('input,select,button')], i = f.indexOf(document.activeElement);
      e.preventDefault();
      f[e.shiftKey ? (i <= 0 ? f.length - 1 : i - 1) : (i < 0 || i === f.length - 1 ? 0 : i + 1)]?.focus();
    }
    return;
  }
  if (e.ctrlKey || e.metaKey || e.altKey || e.target.matches('input,textarea,select')) return;
  if (e.key === 'n' || e.key === 'N') { e.preventDefault(); ui.tab = 'tasks'; render(); $('input[name=title]')?.focus(); }
  else if (e.key === '/') { e.preventDefault(); ui.tab = 'tasks'; render(); $('#q')?.focus(); }
});

modalEl().addEventListener('click', e => { if (e.target === modalEl()) closeModal(false); });

// Local demo sign-in: profile identity is stored on this browser only (not secure authentication).
function showAuth(){const el=$('#authScreen');if(el)el.hidden=false;}
function hideAuth(){const el=$('#authScreen');if(el)el.hidden=true;}
async function compressProfileImage(file){if(!file.type.startsWith('image/'))throw new Error('not image');if(file.size>8*1024*1024)throw new Error('too large');const data=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)});const img=await new Promise((resolve,reject)=>{const i=new Image();i.onload=()=>resolve(i);i.onerror=reject;i.src=data});const size=320,scale=Math.min(1,size/Math.max(img.width,img.height)),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);return canvas.toDataURL('image/jpeg',.78);}
function exportProfileReport(){const data={profile:S.profile,generatedAt:new Date().toISOString(),weekly:reportSummary(7),monthly:reportSummary(30),analytics:reportSummary(30)};const a=document.createElement('a'),u=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.href=u;a.download='earn-it-profile-report.json';a.click();URL.revokeObjectURL(u);}
$('#authForm').addEventListener('submit',async e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target));const name=(f.name||'').trim();if(!name||name.length>40){toast('اكتب اسمًا صحيحًا','err');return;}let photo='';const file=e.target.elements.photo.files?.[0];if(file){try{photo=await compressProfileImage(file)}catch{toast('الصورة غير صالحة أو حجمها كبير','err');return;}}const draft=JSON.parse(JSON.stringify(S));draft.profile={...draft.profile,name,avatar:f.avatar||'🧑‍🚀',bio:draft.profile.bio||'',photo:photo||draft.profile.photo||'',frame:draft.profile.frame||'rare'};if(!persist(draft)){toast(T('err.storage'),'err');return;}S=draft;localStorage.setItem('earnit.session','1');hideAuth();render();toast('أهلًا بيك في EARN IT 👋');});
function updateUserMini(){const p=S.profile||{};$('#userMini').textContent=p.name?`👤 ${p.name}`:'';}
function registerPWA(){if(!('serviceWorker'in navigator)||!/^https?:$/.test(location.protocol))return;navigator.serviceWorker.register('./sw.js').catch(err=>console.warn('PWA service worker:',err));}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();window.deferredInstallPrompt=e;});

loadPrefs();
S = loadState();
const focusExpired = restoreFocusClock();
render();
registerPWA();
if (focusExpired) focusFinish();
notifyDueTasks();
setInterval(notifyDueTasks, 15*60*1000);
</script>
